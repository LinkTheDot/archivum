[package]
name = "entity_extensions"
version = "0.1.0"
edition = "2024"

[dependencies]
benchmarking_tools = { path = "../benchmarking_tools" }
app_config = { path = "../app_config" }
entities = { path = "../entities" }
sea-orm = { version = "1.1", features = ["sqlx-mysql", "runtime-tokio", "macros", "mock"] } 
serde_json = "1.0"
tracing = "0.1"
chrono = "0.4"
url = "2.5"
reqwest = "0.12"
strsim = "0.11"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }

[features]
__test_hook = []
