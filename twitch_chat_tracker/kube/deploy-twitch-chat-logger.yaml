apiVersion: apps/v1
kind: Deployment
metadata:
  name: archivum-twitch-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archivum-twitch-tracker
  template:
    metadata:
      labels:
        app: archivum-twitch-tracker
    spec:
      containers:
        - name: archivum-twitch-tracker
          image: homelab.local:5000/archivum-twitch-tracker:latest
          imagePullPolicy: Always
          env:
            - name: TWITCH_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: archivum
                  key: twitchAccessToken
            - name: TWITCH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: archivum
                  key: twitchClientId
            - name: CONFIG_PATH
              value: "/app/config_files/deploy_config.yml"
            - name: DATABASE_HOST_ADDRESS
              value: "mysql" # resolves to the mysql service running in the cluster
            - name: TRACKED_CHANNELS
              value: 'fallenshadow, shadowchama, linkthedot, ninaninin, alicesawyer, vividlyvivi, lilyhops, oliviamonroe, inislein'
