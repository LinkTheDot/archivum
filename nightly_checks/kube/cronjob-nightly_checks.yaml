apiVersion: batch/v1
kind: CronJob
metadata:
  name: archivum-nightly-checks
  namespace: default
spec:
  schedule: "0 23 * * *"
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      parallelism: 1 
      completions: 1 
      template:
        spec:
          containers:
          - name: nightly-checks
            image: homelab.local:30005/archivum-nightly-checks:latest
            imagePullPolicy: Always
            env:
              - name: TWITCH_ACCESS_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: archivum
                    key: twitchAccessToken
              - name: TWITCH_CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    name: archivum
                    key: twitchClientId
              - name: CONFIG_PATH
                value: "/config_files/deploy_config.yml"
              - name: DATABASE_HOST_ADDRESS
                value: "mysql"
          restartPolicy: Never
